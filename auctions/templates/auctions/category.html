{% extends "auctions/layout.html" %}

{% block title %}
    {{ category }}
{% endblock %}

{% block body %}
    <h1>{{ category }}</h1>
    <ul>
        {% for auction in category_listings %}
            <li>
                <a href="{% url 'auctions:listing' auction.id auction.title %}">{{ auction.title }}</a>
            </li>
        {% empty %}
            <li>No active listings in this category.</li>
        {% endfor %}
    </ul>
{% endblock %}
