{% extends "auctions/layout.html" %}

{% block body %}
    <h2>Active Listings</h2>
    <ul>
        {% for auction in auctions %}
            <li>
                <a href="{% url 'auctions:listing' auction.id auction.title %}">{{ auction.title }}</a>
            </li>
        {% empty %}
            <li>No active listings.</li>
        {% endfor %}
    </ul>
{% endblock %}
