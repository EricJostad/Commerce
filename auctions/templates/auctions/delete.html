{% extends "auctions/layout.html" %}

{% block title %}
    Delete Listing
{% endblock %}

{% block body %}
    <h2>Delete Listing</h2>
    <p>Are you sure you want to delete the listing "{{ auction.title }}"?</p>
    <form  method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'auctions:listing' auction.id %}">Cancel</a>
    </form>
{% endblock %}
