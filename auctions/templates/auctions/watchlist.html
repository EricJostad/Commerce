{% extends "auctions/layout.html" %}

{% block title %}
    Watchlist
{% endblock %}

{% block body %}
    <h2>Watchlist</h2>
    <ul>
    {% if watching %}
        {% for item in watching %}
            <li>
                {{ item.auction.title }}
            </li>
        {% endfor %}
    {% else %}
        <p>You are not watching any auctions.</p>
    {% endif %}
    </ul>
{% endblock %}
